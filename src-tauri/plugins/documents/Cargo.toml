[package]
name = "tauri-plugin-documents"
version = "0.1.0"
authors = [ "Kamil M." ]
description = "Reading and writing files the user picked, through the Android document picker."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-documents"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
serde_json = "1"
