name: Проверки

# The same commands the README asks for before finishing a stage, minus the
# Android build: assembling an APK needs the SDK, the NDK and a signing key,
# none of which belong on a public runner. Everything that can fail without a
# device is checked here.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Интерфейс
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Установить зависимости
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run check:ts

      - name: Тесты
        run: bun run test

      - name: Сборка
        run: bun run build

  core:
    name: Ядро
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `tauri` pulls in its desktop shell even when only the core is being
      # checked, and that shell is GTK and WebKit. Without these the build
      # fails in `glib-sys` long before any of our own code is compiled.
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      # SQLite is compiled from source, so the build is slow enough to be worth
      # caching and stable enough for the cache to keep paying off.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/plugins/reminders
            src-tauri/plugins/documents

      # `tauri-build` reads the config, which points at the frontend bundle.
      - name: Заготовка для tauri-build
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Форматирование
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Тесты ядра
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Тесты плагинов
        run: |
          cargo test --manifest-path src-tauri/plugins/reminders/Cargo.toml
          cargo test --manifest-path src-tauri/plugins/documents/Cargo.toml
